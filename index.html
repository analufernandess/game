<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donut Orbit | Gravity Physics Edition</title>
  <style>
    :root { --ink:#f6f4ff; --muted:#a6a2c4; --panel:rgba(20,19,48,.82); --line:rgba(255,255,255,.14); --pink:#ff5aa8; --cyan:#67e8ff; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; padding:18px 14px 24px; display:grid; place-items:center; color:var(--ink); background:radial-gradient(circle at 14% 10%,rgba(102,71,221,.23),transparent 28rem),radial-gradient(circle at 90% 86%,rgba(255,78,154,.15),transparent 30rem),#08091b; font-family:Georgia,'Times New Roman',serif; }
    .app { width:min(980px,100%); }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:12px; }
    .eyebrow { color:var(--cyan); font:700 10px/1.2 'Courier New',monospace; letter-spacing:.2em; text-transform:uppercase; }
    h1 { margin:6px 0 0; font-size:clamp(26px,5vw,44px); letter-spacing:-.05em; line-height:1; } h1 span { color:var(--pink); }
    .stats { display:flex; gap:10px; align-items:stretch; }
    .stat { min-width:104px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); text-align:right; }
    .stat strong { display:block; font:700 20px 'Courier New',monospace; } .stat small { color:var(--muted); font:10px 'Courier New',monospace; }
    .fuel { height:5px; margin-top:7px; overflow:hidden; border-radius:4px; background:rgba(255,255,255,.1); } .fuel i { display:block; width:0%; height:100%; background:linear-gradient(90deg,#ff3c75,#ffbd45,#42e6b0,#6e74ff,#c766ff); transition:width .3s; }
    .cockpit { position:relative; padding:7px; border:1px solid rgba(255,255,255,.2); border-radius:19px; background:linear-gradient(135deg,#30216a,#ff568f 40%,#253c76 72%,#36cdb0); box-shadow:0 20px 70px rgba(0,0,0,.6),0 0 50px rgba(91,111,255,.14); }
    canvas { display:block; width:100%; aspect-ratio:900/620; border-radius:13px; background:#08091c; image-rendering:auto; }
    .overlay { position:absolute; inset:7px; display:grid; place-items:center; padding:22px; border-radius:13px; background:rgba(8,8,28,.77); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity .25s; } .overlay.active { opacity:1; pointer-events:auto; }
    .modal { max-width:440px; text-align:center; } .modal .mark { font-size:50px; line-height:1; } .modal h2 { margin:15px 0 9px; font-size:clamp(22px,4vw,34px); } .modal p { margin:0 0 20px; color:var(--muted); line-height:1.5; }
    button { padding:13px 18px; border:0; border-radius:10px; color:#fff; background:linear-gradient(110deg,#ff4f9b,#735bff); box-shadow:0 9px 24px rgba(255,79,155,.28); font:700 12px 'Courier New',monospace; cursor:pointer; } button:hover { filter:brightness(1.13); transform:translateY(-1px); }
    .legend { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 2px 0; color:var(--muted); font:11px 'Courier New',monospace; } .legend b { color:var(--ink); font-weight:400; }
    .sequence { display:flex; gap:5px; } .dot { width:13px; height:13px; border-radius:50%; opacity:.25; box-shadow:0 0 9px currentColor; } .dot.active,.dot.done { opacity:1; } .dot.active { outline:2px solid #fff; outline-offset:2px; }
    footer { margin-top:11px; color:var(--muted); text-align:center; font:11px 'Courier New',monospace; }
    @media (max-width:620px) { header { display:block; } .stats { margin-top:13px; } .stat { flex:1; text-align:left; } .legend { display:block; } .sequence { margin-top:10px; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div><div class="eyebrow">GRAVITY PHYSICS / DONUT CAT</div><h1>Donut <span>Orbit</span></h1></div>
      <div class="stats"><div class="stat"><strong id="counter">0 / 7</strong><small>CORES COLETADAS</small><div class="fuel"><i id="fuelBar"></i></div></div><div class="stat"><strong id="status">ÓRBITA</strong><small>ESTADO DO GATO</small></div></div>
    </header>
    <section class="cockpit">
      <canvas id="spaceCanvas" width="900" height="620" aria-label="Arena espacial orbital"></canvas>
      <div id="overlay" class="overlay" role="dialog" aria-live="polite"><div class="modal"><div id="modalMark" class="mark">💥</div><h2 id="modalTitle">Sinal perdido</h2><p id="modalText">O gatinho saiu da rota segura.</p><button id="restartButton">Tentar novamente</button></div></div>
    </section>
    <div class="legend"><b>ESPAÇO / CLIQUE lança na tangente</b><span id="hint">Aguarde uma abertura na órbita</span><div id="sequence" class="sequence" aria-label="Sequência do arco-íris"></div></div>
    <footer>Espaço lança. A/D ou Setas Esquerda/Direita mudam o sentido da órbita.</footer>
  </main>
  <script>
    (() => {
      'use strict';
      const W=900,H=620, TAU=Math.PI*2;
      const RAINBOW=['#ff304f','#ff8b24','#ffe03b','#45e68a','#42b9ff','#665cff','#d46cff'];
      const NAMES=['VERMELHO','LARANJA','AMARELO','VERDE','AZUL','ANIL','VIOLETA'];
      const canvas=document.getElementById('spaceCanvas'), ctx=canvas.getContext('2d');
      const counter=document.getElementById('counter'), statusEl=document.getElementById('status'), fuelBar=document.getElementById('fuelBar'), hint=document.getElementById('hint'), sequence=document.getElementById('sequence');
      const overlay=document.getElementById('overlay'), modalMark=document.getElementById('modalMark'), modalTitle=document.getElementById('modalTitle'), modalText=document.getElementById('modalText'), restartButton=document.getElementById('restartButton');
      let audioContext;
      RAINBOW.forEach((color)=>{const dot=document.createElement('i');dot.className='dot';dot.style.background=color;dot.style.color=color;sequence.appendChild(dot);});

      // Planetas fixos: cada raio de gravidade e maior que o raio visivel.
      const planets=[
        {x:145,y:310,r:49,gravity:116,type:'donut',color:'#f185b4'},
        {x:350,y:135,r:42,gravity:108,type:'muffin',color:'#c88755'},
        {x:605,y:190,r:54,gravity:124,type:'brigadeiro',color:'#70454c'},
        {x:765,y:440,r:44,gravity:112,type:'donut',color:'#7bd4d0'},
        {x:425,y:485,r:51,gravity:122,type:'muffin',color:'#d9985d'}
      ];
      const collectibles=[
        {x:145,y:230},{x:350,y:62},{x:690,y:190},{x:765,y:365},{x:425,y:403},{x:520,y:190},{x:285,y:250}
      ];
      let state;

      function makeStars(){ return Array.from({length:125},()=>({x:Math.random()*W,y:Math.random()*H,r:.4+Math.random()*1.5,a:.25+Math.random()*.7,p:Math.random()*TAU,s:.5+Math.random()*2})); }
      function makeAsteroids(){ return [{x:255,y:330,r:10,vx:24,vy:-18,phase:0},{x:505,y:350,r:8,vx:-31,vy:20,phase:1.7},{x:710,y:92,r:9,vx:18,vy:29,phase:3.1},{x:520,y:535,r:7,vx:28,vy:-22,phase:4.2}]; }
      function reset(){ state={mode:'orbit',orbitDirection:1,cat:{x:145,y:253,vx:0,vy:0,angle:-Math.PI/2,orbit:0},collected:0,trail:[],stars:makeStars(),asteroids:makeAsteroids(),last:performance.now(),time:0,launches:0}; updateHud(); overlay.classList.remove('active'); }
      function distance(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
      function currentPlanet(){ return planets[state.cat.orbit]; }
      function updateHud(){ counter.textContent=state.collected+' / 7'; fuelBar.style.width=(state.collected/7*100)+'%'; statusEl.textContent=state.mode==='orbit'?'ÓRBITA '+(state.orbitDirection>0?'↻':'↺'):state.mode==='free'?'VOO LIVRE':state.mode==='victory'?'HYPERDRIVE':'PERDIDO'; [...sequence.children].forEach((dot,i)=>{dot.classList.toggle('done',i<state.collected);dot.classList.toggle('active',i===state.collected&&state.mode!=='victory');}); hint.textContent=state.mode==='orbit'?'A/D ou ←/→ mudam o sentido | Espaço lança':state.mode==='free'?'Alcance um campo gravitacional':'Sistema estabilizado'; }
      function sound(kind,index){ const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return; audioContext ||= new AudioCtor(); const now=audioContext.currentTime, osc=audioContext.createOscillator(), gain=audioContext.createGain(); osc.type=kind==='collect'?'sine':'triangle'; osc.frequency.value=kind==='collect'?420+index*70:kind==='launch'?190:kind==='win'?740:110; gain.gain.setValueAtTime(.07,now);gain.gain.exponentialRampToValueAtTime(.001,now+(kind==='win'?1:.24));osc.connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+(kind==='win'?1:.24)); }

      // A tangente e perpendicular ao raio: (-sin(theta), cos(theta)).
      function launch(){ if(state.mode!=='orbit')return; const tangent={x:-Math.sin(state.cat.angle)*state.orbitDirection,y:Math.cos(state.cat.angle)*state.orbitDirection}; const speed=235; state.cat.vx=tangent.x*speed;state.cat.vy=tangent.y*speed;state.mode='free';state.launches++;sound('launch');updateHud(); }
      function enterOrbit(index){ const planet=planets[index]; const dx=state.cat.x-planet.x,dy=state.cat.y-planet.y; state.cat.orbit=index;state.cat.angle=Math.atan2(dy,dx);state.mode='orbit';state.cat.vx=0;state.cat.vy=0; sound('launch');updateHud(); }
      function collect(index){ if(index!==state.collected)return; state.collected++;state.trail.push({x:state.cat.x,y:state.cat.y,color:RAINBOW[index],life:1});sound('collect',index);updateHud(); if(state.collected===7){state.mode='victory';sound('win');updateHud();finish('SISTEMA SOLAR COLORIDO!','O Hyperdrive de Arco-Íris foi ativado. Missão perfeita, Donut Cat.',true);} }
      function checkCollect(){ const target=collectibles[state.collected];if(target&&distance(state.cat,target)<20)collect(state.collected); }
      function updateAsteroids(dt){ state.asteroids.forEach((a)=>{a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.x<-20)a.x=W+20;if(a.x>W+20)a.x=-20;if(a.y<-20)a.y=H+20;if(a.y>H+20)a.y=-20;}); }
      function finish(title,text,won){state.mode=won?'victory':'gameover';modalMark.textContent=won?'🌈':'💥';modalTitle.textContent=title;modalText.textContent=text;restartButton.textContent=won?'Jogar novamente':'Tentar novamente';overlay.classList.add('active');updateHud();}
      function update(dt){ state.time+=dt;state.stars.forEach((star)=>star.p+=dt*star.s); if(state.mode==='gameover')return; if(state.mode==='victory'){state.trail.forEach((trail)=>trail.life=Math.max(0,trail.life-dt*.08));return;} updateAsteroids(dt); const cat=state.cat;
        if(state.mode==='orbit'){ const planet=currentPlanet(); cat.angle+=dt*(1.15+state.collected*.035)*state.orbitDirection; const radius=planet.r+31;cat.x=planet.x+Math.cos(cat.angle)*radius;cat.y=planet.y+Math.sin(cat.angle)*radius;checkCollect(); }
        else if(state.mode==='free'){ let captured=-1; planets.forEach((planet,index)=>{const d=distance(cat,planet); if(index!==cat.orbit && d<planet.gravity && d>planet.r+8 && captured<0)captured=index;}); if(captured>=0)enterOrbit(captured); else {cat.x+=cat.vx*dt;cat.y+=cat.vy*dt;cat.vx*=Math.pow(.998,dt*60);cat.vy*=Math.pow(.998,dt*60);checkCollect();if(cat.x<-35||cat.x>W+35||cat.y<-35||cat.y>H+35){finish('Sinal perdido','O espaço venceu desta vez. Espere a tangente certa e tente novamente.',false);return;} } }
        state.asteroids.forEach((a)=>{if(distance(cat,a)<a.r+14)finish('Asteroide de açúcar!','O impacto interrompeu a rota orbital.',false);});
      }
      function drawStar(star){ctx.fillStyle=`rgba(230,234,255,${star.a*(.65+.35*Math.sin(star.p))})`;ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,TAU);ctx.fill();}
      function drawPlanet(planet){ctx.save();ctx.translate(planet.x,planet.y);ctx.setLineDash([3,7]);ctx.strokeStyle='rgba(123,231,255,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,planet.gravity,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.shadowColor=planet.color;ctx.shadowBlur=18;ctx.fillStyle=planet.color;ctx.beginPath();ctx.arc(0,0,planet.r,0,TAU);ctx.fill();ctx.shadowBlur=0; if(planet.type==='donut'){ctx.fillStyle='#ffe0a6';ctx.beginPath();ctx.arc(0,0,17,0,TAU);ctx.fill();ctx.fillStyle='rgba(255,255,255,.6)';[[-22,-15],[18,-12],[-16,20],[21,16]].forEach(([x,y])=>ctx.fillRect(x,y,6,3));} else if(planet.type==='muffin'){ctx.fillStyle='#7c4937';for(let i=-2;i<3;i++)ctx.fillRect(i*12-3,7,6,19);ctx.fillStyle='#f4bd76';ctx.beginPath();ctx.arc(0,-2,35,Math.PI,TAU);ctx.fill();} else {ctx.fillStyle='#2b1c2c';ctx.beginPath();ctx.arc(0,0,37,0,TAU);ctx.fill();ctx.fillStyle='#fff';[[-18,-11],[4,-17],[17,8],[-2,15]].forEach(([x,y])=>{ctx.fillRect(x,y,3,3);});}ctx.restore();}
      function drawCat(x,y,scale,rotation){ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.scale(scale,scale);ctx.shadowColor='#ff62b4';ctx.shadowBlur=14;ctx.fillStyle='#f18dbd';ctx.beginPath();ctx.arc(0,11,19,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fff0d6';ctx.beginPath();ctx.arc(0,11,7,0,TAU);ctx.fill();ctx.fillStyle='#949bad';ctx.beginPath();ctx.arc(0,-10,16,0,TAU);ctx.fill();ctx.beginPath();ctx.moveTo(-14,-18);ctx.lineTo(-10,-32);ctx.lineTo(-2,-19);ctx.moveTo(2,-19);ctx.lineTo(11,-32);ctx.lineTo(15,-17);ctx.fill();ctx.fillStyle='#201e36';ctx.fillRect(-8,-13,4,5);ctx.fillRect(5,-13,4,5);ctx.fillStyle='#ff5aa8';ctx.fillRect(-2,-4,4,3);[['#ffe044',-11,8],['#5deaff',7,5],['#65ed82',-4,21],['#9b76ff',12,17]].forEach(([color,sx,sy])=>{ctx.fillStyle=color;ctx.fillRect(sx,sy,4,2);});ctx.restore();}
      function drawCollectible(item,index){const active=index===state.collected;if(index<state.collected)return;const pulse=1+Math.sin(state.time*4+index)*.12;ctx.strokeStyle=RAINBOW[index];ctx.globalAlpha=active?1:.3;ctx.lineWidth=active?2:1;ctx.beginPath();ctx.arc(item.x,item.y,active?13*pulse:9,0,TAU);ctx.stroke();ctx.fillStyle=RAINBOW[index];ctx.shadowColor=RAINBOW[index];ctx.shadowBlur=active?16:5;ctx.beginPath();ctx.arc(item.x,item.y,active?5:3,0,TAU);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;}
      function drawAsteroid(a){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(state.time*2+a.phase);ctx.fillStyle='#292637';ctx.strokeStyle='#9389a9';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-a.r,0);ctx.lineTo(-a.r*.45,-a.r*.9);ctx.lineTo(a.r*.6,-a.r*.75);ctx.lineTo(a.r,a.r*.1);ctx.lineTo(a.r*.3,a.r);ctx.lineTo(-a.r*.8,a.r*.6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
      function drawHyperdrive(){const t=state.time, x=W*.5+Math.cos(t*.65)*260,y=H*.5+Math.sin(t*.9)*145,angle=Math.atan2(Math.cos(t*.9)*145*.9,-Math.sin(t*.65)*260*.65);for(let i=0;i<7;i++){ctx.globalAlpha=.72;ctx.strokeStyle=RAINBOW[i];ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x-100,y+(i-3)*4);ctx.lineTo(x-700,y+(i-3)*10);ctx.stroke();}ctx.globalAlpha=1;drawCat(x,y,1.2,angle);}
      function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#090a20';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(112,103,202,.09)';ctx.beginPath();ctx.arc(450,300,250+Math.sin(state.time)*10,0,TAU);ctx.fill();state.stars.forEach(drawStar);planets.forEach(drawPlanet);collectibles.forEach(drawCollectible);state.trail.forEach((trail)=>{ctx.globalAlpha=trail.life*.65;ctx.fillStyle=trail.color;ctx.beginPath();ctx.arc(trail.x,trail.y,3+trail.life*4,0,TAU);ctx.fill();});ctx.globalAlpha=1;state.asteroids.forEach(drawAsteroid);if(state.mode==='victory')drawHyperdrive();else drawCat(state.cat.x,state.cat.y,1,state.mode==='free'?Math.atan2(state.cat.vy,state.cat.vx):state.cat.angle+Math.PI/2);requestAnimationFrame(loop);}
      function loop(now){const dt=Math.min((now-state.last)/1000,.04);state.last=now;update(dt);draw();}
      const launchInput=(event)=>{event.preventDefault();launch();};window.addEventListener('keydown',(event)=>{if(event.code==='Space'){event.preventDefault();launch();} if(state.mode==='orbit'&&(event.code==='ArrowLeft'||event.code==='KeyA')){event.preventDefault();state.orbitDirection=-1;updateHud();} if(state.mode==='orbit'&&(event.code==='ArrowRight'||event.code==='KeyD')){event.preventDefault();state.orbitDirection=1;updateHud();}});canvas.addEventListener('pointerdown',launchInput);restartButton.addEventListener('click',reset);reset();requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
